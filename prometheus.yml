global:
  scrape_interval:     15s
  external_labels:
    monitor: 'railway-prom'

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 5s
    basic_auth:
      username: metrics
      password_file: /run/prometheus-secrets/web-password
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'demo_prometheus_metrics'
    scrape_interval: 5s
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ['railway-prometheus-production-24ce.up.railway.app']

  - job_name: 'postgres_metrics_collector'
    scrape_interval: 1s
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ['postgres-metrics-collector-staging.up.railway.app']

  # - job_name: 'postgres'
  #   scrape_interval: 5s
  #   static_configs:
  #     - targets: ['localhost:9187']

  # - job_name: 'mysql'
  #   scrape_interval: 5s
  #   static_configs:
  #     - targets: ['localhost:9104']

  - job_name: 'freedesign'
    scrape_interval: 2m
    scrape_timeout: 10s
    scheme: https
    metrics_path: /api/metrics
    follow_redirects: false
    authorization:
      type: Bearer
      credentials_file: /run/prometheus-secrets/freedesign-token
    static_configs:
      - targets: ['freedesign.md']
