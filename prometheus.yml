global:
  scrape_interval: 15s
  external_labels:
    monitor: railway-prom

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Shared public demo: keep the request rate modest.
  # Replace this with your own exporter for production monitoring.
  - job_name: node_demo
    scrape_interval: 60s
    scrape_timeout: 10s
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ['node.demo.prometheus.io']
